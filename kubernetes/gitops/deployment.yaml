apiVersion: apps/v1
kind: Deployment
metadata:
  name: easyshop-cicd
  namespace: easyshop-cicd
  labels:
    app: easyshop-cicd
spec:
  replicas: 2
  revisionHistoryLimit: 10

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: easyshop-cicd

  template:
    metadata:
      labels:
        app: easyshop-cicd

    spec:
      containers:
        - name: easyshop
          image: johncorner158/easyshop-ci:build-16
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3000

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1

          env:
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"

          envFrom:
            - configMapRef:
                name: easyshop-cicd-config
            - secretRef:
                name: easyshop-cicd-secrets

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
